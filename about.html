<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b1020">
  <title>About — Hello, world.</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #0b1020; color: #f5f7ff; }
    * { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; display: grid; place-items: center; background: radial-gradient(ellipse at 50% 115%, rgba(102,75,255,.23), transparent 50%), radial-gradient(ellipse at 12% 15%, rgba(43,197,255,.11), transparent 42%), #0b1020; }
    .grain { position: fixed; inset: 0; pointer-events: none; opacity: .12; background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.25'/%3E%3C/svg%3E"); }
    .site-nav { position: fixed; z-index: 2; top: 24px; left: 50%; transform: translateX(-50%); display: flex; gap: 6px; padding: 6px; border: 1px solid rgba(188,203,255,.14); border-radius: 999px; background: rgba(12,18,37,.72); backdrop-filter: blur(16px); }
    .site-nav a { padding: 10px 15px; border-radius: 999px; color: #9aa8ca; font-size: 13px; text-decoration: none; transition: color .2s, background .2s; }
    .site-nav a:hover, .site-nav a[aria-current="page"] { color: #f5f7ff; background: rgba(255,255,255,.09); }
    main { position: relative; width: min(760px, calc(100% - 40px)); padding: 110px 28px 60px; text-align: center; animation: arrive .8s cubic-bezier(.2,.8,.2,1) both; }
    .halo { position: absolute; z-index: -1; width: min(540px,90vw); aspect-ratio: 1; left: 50%; top: 50%; transform: translate(-50%,-52%); border-radius: 50%; background: radial-gradient(circle,rgba(91,91,255,.16),rgba(68,198,255,.055) 38%,transparent 69%); filter: blur(8px); animation: breathe 6s ease-in-out infinite; }
    .eyebrow { display: inline-flex; align-items: center; gap: 9px; padding: 9px 14px; border: 1px solid rgba(188,203,255,.15); border-radius: 999px; background: rgba(255,255,255,.045); color: #b7c5ed; font-size: 11px; font-weight: 650; letter-spacing: .16em; text-transform: uppercase; }
    .spark { width: 7px; height: 7px; border-radius: 50%; background: #65edc1; box-shadow: 0 0 13px #65edc1; }
    h1 { margin: 25px 0 18px; font-size: clamp(48px,9vw,82px); line-height: 1; letter-spacing: -.07em; font-weight: 760; }
    h1 span { background: linear-gradient(105deg,#fbfdff 12%,#a8bbff 54%,#75e4e6 95%); -webkit-background-clip: text; background-clip: text; color: transparent; filter: drop-shadow(0 8px 32px rgba(108,137,255,.18)); }
    .description { max-width: 560px; margin: 0 auto; color: #9aa8ca; font-size: clamp(15px,2.5vw,18px); line-height: 1.8; }
    .rule { width: 46px; height: 1px; margin: 30px auto 18px; background: linear-gradient(90deg,transparent,#7185ff,#65dfda,transparent); }
    .signature { color: #697797; font-size: 12px; letter-spacing: .1em; text-transform: uppercase; }
    @keyframes arrive { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes breathe { 0%,100% { opacity: .7; transform: translate(-50%,-52%) scale(.96); } 50% { opacity: 1; transform: translate(-50%,-52%) scale(1.04); } }
    @media (max-width: 480px) { main { padding-inline: 18px; } }
    @media (prefers-reduced-motion: reduce) { *,*::before,*::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; scroll-behavior: auto !important; } }
  </style>
</head>
<body>
  <div class="grain" aria-hidden="true"></div>
  <nav class="site-nav" aria-label="Main navigation">
    <a href="index.html">Home</a>
    <a href="about.html" aria-current="page">About</a>
    <a href="gallery.html">Gallery</a>
    <a href="contact.html">Contact</a>
  </nav>
  <main>
    <div class="halo" aria-hidden="true"></div>
    <div class="eyebrow"><span class="spark" aria-hidden="true"></span> A little about this page</div>
    <h1><span>Curiosity</span><br><span>starts here.</span></h1>
    <p class="description">Hi, I’m Asha. This little corner of the web is a place to explore ideas, learn by making, and see where a blank canvas can lead. Thanks for stopping by.</p>
    <div class="rule" aria-hidden="true"></div>
    <div class="signature">A work in progress, by design</div>
  </main>
</body>
</html>
